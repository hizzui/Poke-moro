<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <script>window.tailwind = { config: {} };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://threejs.org/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <canvas id="three-canvas"></canvas>

    <!-- Container Central -->
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-6xl">

            <!-- FASE 1: Seleção de Animal -->
            <div id="selection-phase">
                <div class="text-center mb-12">
                    <h1 class="text-3xl font-bold mb-8">Escolha seu companheiro</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Pássaro -->
                        <button onclick="selectAnimal('passaro')" class="animal-card">
                            <img src="/static/passaro.gif" alt="Pássaro" class="pixel-art">
                            <h2 class="text-lg font-bold mt-4">Pássaro</h2>
                            <p class="text-sm text-gray-600 mt-2">Criativo</p>
                        </button>

                        <!-- Coruja -->
                        <button onclick="selectAnimal('coruja')" class="animal-card">
                            <img src="/static/coruja.gif" alt="Coruja" class="pixel-art">
                            <h2 class="text-lg font-bold mt-4">Coruja</h2>
                            <p class="text-sm text-gray-600 mt-2">Sábio</p>
                        </button>

                        <!-- Raposa -->
                        <button onclick="selectAnimal('raposa')" class="animal-card">
                            <img src="/static/raposa.gif" alt="Raposa" class="pixel-art">
                            <h2 class="text-lg font-bold mt-4">Raposa</h2>
                            <p class="text-sm text-gray-600 mt-2">Estratégico</p>
                        </button>
                    </div>
                </div>
            </div>

            <!-- FASE 2: Sessão (Escondida) -->
            <div id="session-phase" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <!-- Timer (Main) -->
                    <div class="lg:col-span-2">
                        <!-- Animal Info Small -->
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-center gap-3">
                                <img id="animal-emoji" src="" alt="Animal" class="pixel-art" style="width: 48px; height: 48px; margin: 0;">
                                <div class="text-left">
                                    <h2 id="animal-name" class="font-bold text-lg"></h2>
                                    <p id="animal-type" class="text-sm text-gray-600"></p>
                                </div>
                            </div>
                            <button onclick="changeAnimal()" class="btn-secondary text-sm">⟲ Trocar</button>
                        </div>

                        <!-- Timer Card -->
                        <div class="card">
                            <div id="session-status" class="badge-focus mb-6">⏱️ Foco</div>

                            <div class="text-center mb-12">
                                <div class="timer-display">
                                    <span id="timer-min">25</span>:<span id="timer-sec">00</span>
                                </div>
                            </div>

                            <!-- Timer Progress -->
                            <div class="mb-8">
                                <div class="progress-bar">
                                    <div id="timer-fill" class="progress-bar-fill" style="width: 0%"></div>
                                </div>
                            </div>

                            <!-- Controls -->
                            <div class="flex gap-3 flex-wrap justify-center">
                                <button id="start-btn" onclick="startTimer()" class="btn-primary">Iniciar</button>
                                <button id="pause-btn" onclick="pauseTimer()" class="btn-primary hidden">Pausar</button>
                                <button id="resume-btn" onclick="resumeTimer()" class="btn-primary hidden">Continuar</button>
                                <button onclick="resetTimer()" class="btn-secondary">Resetar</button>
                                <button onclick="toggleSettings()" class="btn-secondary">⚙️ Duração</button>
                            </div>

                            <!-- Stats -->
                            <div class="mt-8 pt-6 border-t border-gray-200">
                                <div class="stats-grid">
                                    <div class="stat-item">
                                        <div class="stat-value" id="stat-min">0</div>
                                        <div class="stat-label">Minutos</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value" id="stat-xp">0</div>
                                        <div class="stat-label">XP</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value" id="stat-sessions">0</div>
                                        <div class="stat-label">Sessões</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Settings (Hidden) -->
                        <div id="settings-panel" class="card hidden mt-6">
                            <h3 class="font-bold mb-4">Duração (minutos)</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-sm block mb-2">Foco</label>
                                    <input type="number" id="focus-input" min="1" max="60" value="25" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-sm block mb-2">Pausa</label>
                                    <input type="number" id="break-input" min="1" max="30" value="5" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                </div>
                            </div>
                            <button onclick="applySettings()" class="btn-primary w-full mt-4">Aplicar</button>
                        </div>
                    </div>

                    <!-- To-Do (Right Side) -->
                    <div class="lg:col-span-1">
                        <div class="card">
                            <h3 class="font-bold mb-4">Tarefas</h3>
                            
                            <!-- Input -->
                            <div class="flex gap-2 mb-4">
                                <input type="text" id="todo-input" placeholder="Adicionar..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <button onclick="addTodo()" class="btn-primary px-4">+</button>
                            </div>

                            <!-- Lista -->
                            <div id="todo-list" class="space-y-2 max-h-96 overflow-y-auto">
                                <p class="text-xs text-gray-500 text-center py-4">Nenhuma tarefa</p>
                            </div>

                            <!-- Clear -->
                            <button onclick="clearCompleted()" class="btn-secondary w-full mt-4 text-sm">Limpar</button>
                        </div>

                        <!-- Nível Separado -->
                        <div class="card mt-6">
                            <h3 class="font-bold mb-4">Nível do Animal</h3>
                            <div class="text-center">
                                <img id="animal-emoji-large" src="" alt="Animal" class="pixel-art" style="width: 100px; height: 100px; margin: 0 auto 16px;">
                                <div class="text-3xl font-bold mb-4" id="level">1</div>
                                <div class="progress-bar">
                                    <div id="xp-fill" class="progress-bar-fill" style="width: 0%"></div>
                                </div>
                                <div class="text-xs text-gray-600 mt-2"><span id="xp-curr">0</span>/<span id="xp-max">100</span> XP</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <audio id="notification-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBg==" type="audio/wav">
    </audio>
    <script src="/static/script.js"></script>
</body>
</html>
